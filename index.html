<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f9f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Josephine's Kitchen</title>
<style>
:root{--bg:#f4f8fb;--card:#fff;--ink:#20303d;--muted:#667784;--accent:#2f6f9f;--accent-dark:#23577d;--soft:#e5f0f7;--line:#d6e3ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 18px 10px;position:sticky;top:0;background:rgba(244,248,251,.96);backdrop-filter:blur(12px);z-index:3;border-bottom:1px solid var(--line)}
h1{font-size:1.4rem;margin:0} .sub{color:var(--muted);font-size:.92rem}
main{padding:14px 14px 92px;max-width:760px;margin:auto}.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 8px rgba(31,67,92,.06)}
button,.button{appearance:none;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:650;background:var(--accent);color:white;min-height:46px}
button.secondary{background:var(--soft);color:var(--accent)}button:active{transform:translateY(1px)}button.ghost{background:white;color:var(--accent);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{font-size:.78rem;background:var(--soft);color:var(--accent);padding:5px 8px;border-radius:999px}
details summary{font-weight:750;cursor:pointer}.nutrition{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.nutrition div{background:#eef5f9;border-radius:12px;padding:9px;text-align:center}.nutrition b{display:block}
label.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #e4edf3}input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--accent)}
select,input[type=text],input[type=number]{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px;background:white}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:white;color:var(--muted);border-radius:0;padding:9px 2px 7px;min-height:58px;font-size:.72rem}nav button.active{color:var(--accent)}nav span{display:block;font-size:1.25rem}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:.85rem;color:var(--muted)}.option-group{margin:12px 0;padding:10px 12px;background:#f7fafc;border:1px solid var(--line);border-radius:14px}.option-group>strong{display:block;margin-bottom:4px}.option-row{display:flex;gap:9px;align-items:flex-start;padding:7px 0}.count-badge{margin-left:auto;white-space:nowrap;background:var(--soft);color:var(--accent-dark);font-size:.76rem;font-weight:700;padding:4px 8px;border-radius:999px}.week-actions{display:flex;gap:8px;flex-wrap:wrap}.week-actions button{flex:1}.hidden{display:none!important}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#20303d;color:white;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9}.toast.show{opacity:1}
@media(min-width:700px){main{padding-bottom:30px}nav{position:sticky;top:73px;max-width:760px;margin:auto;border:1px solid var(--line);border-radius:15px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>Josephine's Kitchen</h1></header>
<main>
<section id="home" class="panel active">
  <div class="card"><h2>What sounds right today?</h2><div class="grid">
    <button onclick="showRandom('main')">🍚 Main meal</button>
    <button onclick="showRandom('soups')">🍲 Soup</button>
    <button onclick="openEmergency()">⚡ Low energy</button>
    <button onclick="generateGrazing()">🥒 Grazing plate</button>
    <button onclick="showRandom('dessert')">🍓 Dessert</button>
    <button class="secondary" onclick="buildWeek()">✨ Build a week</button>
  </div></div>
  <div id="homeResult"></div>
  <div class="card"><div class="section-title"><h3>Need to use</h3><button class="secondary" onclick="matchIngredients()">Find meals</button></div><input id="useUp" type="text" placeholder="e.g. mushrooms, spinach, cabbage"></div>
</section>
<section id="meals" class="panel">
  <div class="card">
    <label>Section<select id="sectionFilter"></select></label>
    <label>Effort<select id="effortFilter"><option value="">Any effort</option></select></label>
    <label>Weather<select id="weatherFilter"><option value="">Any weather</option></select></label>
    <button style="margin-top:10px" onclick="renderMeals()">Apply filters</button>
  </div>
  <div id="mealList"></div>
</section>
<section id="week" class="panel"><div class="section-title"><h2>This week</h2></div><div class="week-actions"><button onclick="navTo('meals')">Add meals</button><button class="secondary" onclick="buildWeek()">Build a suggested week</button></div><div id="weekList"></div></section>
<section id="shopping" class="panel">
  <div class="section-title"><h2>Shopping</h2><button class="secondary" onclick="copyShopping()">Copy list</button></div>
  <div class="card"><label class="row"><input id="includeStaples" type="checkbox" checked onchange="renderShopping()">Include missing staples</label><label class="row"><input id="includeEmergency" type="checkbox" checked onchange="renderShopping()">Maintain emergency coverage</label></div>
  <div id="shoppingList"></div>
</section>
<section id="pantry" class="panel">
  <h2>Pantry & homemade staples</h2>
  <div id="pantryList"></div>
</section>
</main>
<nav>
<button class="active" data-panel="home"><span>🏠</span>Home</button>
<button data-panel="meals"><span>🍚</span>Meals</button>
<button data-panel="week"><span>✨</span>Week</button>
<button data-panel="shopping"><span>🛒</span>Shopping</button>
<button data-panel="pantry"><span>📦</span>Pantry</button>
</nav>

tableSnacks":2,"desserts":1}}};
const state=JSON.parse(localStorage.getItem('jk-state')||'{}');
state.week=state.week||[];state.checked=state.checked||{};state.pantry=state.pantry||{};state.selections=state.selections||{};state.homemade=state.homemade||{kimchi:'Plenty available',pickles:'Plenty available'};
const save=()=>localStorage.setItem('jk-state',JSON.stringify(state));
const allItems=()=>DATA.meals.sections.flatMap(s=>s.items.map(i=>({...i,section:s.id,sectionName:s.name})));
function navTo(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));if(id==='shopping')renderShopping();if(id==='pantry')renderPantry();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navTo(b.dataset.panel));
function escAttr(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll("'",'&#39;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function optionKey(mealId,group,item){return `${mealId}|||${group}|||${item}`;}
function isSelected(mealId,group,item){return !!state.selections[optionKey(mealId,group,item)];}
function setSelection(mealId,group,item,checked){state.selections[optionKey(mealId,group,item)]=checked;save();if(document.getElementById('shopping').classList.contains('active'))renderShopping();}
function optionGroupHTML(i,label,groupName,values){
 return `<div class="option-group"><strong>${label}</strong>${values.map(v=>`<label class="option-row"><input type="checkbox" ${isSelected(i.id,groupName,v)?'checked':''} onchange="setSelection('${escAttr(i.id)}','${escAttr(groupName)}','${escAttr(v)}',this.checked)"><span>${v}</span></label>`).join('')}</div>`;
}
function itemCard(i,context='browse'){
 const n=i.nutrition||{}; const ing=i.ingredients||{};
 const groups=[];
 if(ing.required)groups.push(`<p><b>Included:</b> ${ing.required.join(', ')}</p>`);
 Object.entries(ing.chooseOne||{}).forEach(([k,v])=>groups.push(optionGroupHTML(i,`Choose ${k}`,`chooseOne:${k}`,v)));
 Object.entries(ing.chooseSeveral||{}).forEach(([k,v])=>groups.push(optionGroupHTML(i,`Choose ${k}`,`chooseSeveral:${k}`,v)));
 if(ing.optional)groups.push(optionGroupHTML(i,'Optional additions','optional',ing.optional));
 const action=context==='week'
  ? `<button class="ghost" onclick="removeWeek('${escAttr(i.id)}')">Remove from week</button>`
  : `<button onclick="addToWeek('${escAttr(i.id)}')">Add to week</button>`;
 return `<div class="card"><details ${context==='week'?'open':''}><summary>${i.name}</summary><p>${i.summary||''}</p>
 <div class="chips">${(i.tags||[]).slice(0,8).map(t=>`<span class="chip">${t}</span>`).join('')}</div>
 ${n.calories?`<div class="nutrition"><div><b>${n.calories[0]}–${n.calories[1]}</b>cal</div><div><b>${n.protein[0]}–${n.protein[1]}g</b>protein</div><div><b>${n.fiber[0]}–${n.fiber[1]}g</b>fiber</div></div><p class="small">${n.notes||''}</p>`:''}
 ${groups.join('')}${action}</details></div>`;
}
function showRandom(section){const pool=allItems().filter(i=>i.section===section);const i=pool[Math.floor(Math.random()*pool.length)];document.getElementById('homeResult').innerHTML=itemCard(i);}
function openEmergency(){const levels=['None','Five minutes','Fifteen minutes'];document.getElementById('homeResult').innerHTML=`<div class="card"><h3>How much energy?</h3><div class="grid">${levels.map(x=>`<button onclick="showEmergency('${x}')">${x}</button>`).join('')}</div></div>`;}
function showEmergency(level){const pool=allItems().filter(i=>i.section==='emergency'&&i.energy===level);document.getElementById('homeResult').innerHTML=pool.map(itemCard).join('');}
function generateGrazing(){const t=allItems().find(i=>i.id==='grazing-template').generator;const pick=a=>a[Math.floor(Math.random()*a.length)];const proteins=[...t.protein].sort(()=>Math.random()-.5).slice(0,2);document.getElementById('homeResult').innerHTML=`<div class="card"><h3>Your grazing plate</h3><p><b>Protein:</b> ${proteins.join(' + ')}<br><b>Crunch:</b> ${pick(t.crunch)}<br><b>Acid:</b> ${pick(t.acid)}<br><b>Produce:</b> ${pick(t.produce)}<br><b>Extra:</b> ${pick(t.extra)}</p><button onclick="generateGrazing()">Generate another</button></div>`;}
function addToWeek(id){if(!state.week.includes(id))state.week.push(id);save();toast('Added to this week');renderWeek();}
function buildWeek(){
 if(state.week.length&&!confirm('Replace your current week with a new suggested week?'))return;
 const get=(section,n)=>allItems().filter(i=>i.section===section).sort(()=>Math.random()-.5).slice(0,n);
 const selected=[...get('main',2),...get('soups',1),...get('emergency',2),...get('grazing',1),...get('dessert',1)];
 state.week=selected.map(i=>i.id);save();renderWeek();navTo('week');
}
function renderWeek(){
 const items=state.week.map(id=>allItems().find(i=>i.id===id)).filter(Boolean);
 document.getElementById('weekList').innerHTML=items.length?items.map(i=>itemCard(i,'week')).join(''):'<div class="card"><p>No meals have been added yet.</p><button onclick="navTo(\'meals\')">Browse meals</button></div>';
}
function removeWeek(id){state.week=state.week.filter(x=>x!==id);save();renderWeek();renderShopping();}
function selectedIngredients(i){
 const ing=i.ingredients||{};const a=[...(ing.required||[])];
 Object.entries(ing.chooseOne||{}).forEach(([k,v])=>v.forEach(x=>{if(isSelected(i.id,`chooseOne:${k}`,x))a.push(x)}));
 Object.entries(ing.chooseSeveral||{}).forEach(([k,v])=>v.forEach(x=>{if(isSelected(i.id,`chooseSeveral:${k}`,x))a.push(x)}));
 (ing.optional||[]).forEach(x=>{if(isSelected(i.id,'optional',x))a.push(x)});
 return [...new Set(a.map(x=>x.toLowerCase()))];
}
function addCount(map,item,type='recipe'){
 const key=item.toLowerCase();if(!map[key])map[key]={item:key,recipes:0,reasons:new Set()};
 if(type==='recipe')map[key].recipes+=1;else map[key].reasons.add(type);
}
function renderShopping(){
 const map={};
 state.week.map(id=>allItems().find(i=>i.id===id)).filter(Boolean).forEach(i=>selectedIngredients(i).forEach(x=>addCount(map,x,'recipe')));
 if(document.getElementById('includeStaples')?.checked){
  Object.values(DATA.pantry.alwaysStocked).flat().forEach(x=>{if(state.pantry[x]===false)addCount(map,x,'restock')});
 }
 if(document.getElementById('includeEmergency')?.checked)['Fairlife protein shakes','crackers','canned fish','eggs','bread','Greek yogurt'].forEach(x=>addCount(map,x,'emergency'));
 if(state.homemade.kimchi!=='Plenty available')DATA.pantry.homemadeStaples.find(x=>x.id==='kimchi').ingredients.forEach(x=>addCount(map,x,'kimchi'));
 if(state.homemade.pickles!=='Plenty available'){const p=DATA.pantry.homemadeStaples.find(x=>x.id==='pickles');[...p.frequent,...p.supplies].forEach(x=>addCount(map,x,'pickles'));}
 const list=Object.values(map).sort((a,b)=>a.item.localeCompare(b.item));
 document.getElementById('shoppingList').innerHTML=list.length?`<div class="card">${list.map(x=>{const badges=[];if(x.recipes)badges.push(`${x.recipes} recipe${x.recipes===1?'':'s'}`);if(x.reasons.has('restock'))badges.push('pantry low');if(x.reasons.has('emergency'))badges.push('emergency');if(x.reasons.has('kimchi'))badges.push('kimchi');if(x.reasons.has('pickles'))badges.push('pickles');return `<label class="row"><input type="checkbox" ${state.checked[x.item]?'checked':''} onchange="state.checked['${x.item.replaceAll("'","\'")}']=this.checked;save()"><span>${x.item}</span><span class="count-badge">${badges.join(' · ')}</span></label>`}).join('')}</div>`:'<div class="card">Nothing is currently on the shopping list.</div>';
}
function copyShopping(){const lines=[...document.querySelectorAll('#shoppingList label.row')].filter(l=>!l.querySelector('input').checked).map(l=>'• '+l.innerText.trim());navigator.clipboard.writeText(lines.join('\n'));toast('Shopping list copied');}
function renderPantry(){
 const stock=Object.entries(DATA.pantry.alwaysStocked).map(([g,items])=>`<div class="card"><h3>${g}</h3>${items.map(x=>`<label class="row"><input type="checkbox" ${state.pantry[x]!==false?'checked':''} onchange="state.pantry['${x}']=this.checked;save();renderShopping()"><span>${x}</span></label>`).join('')}</div>`).join('');
 const homemade=DATA.pantry.homemadeStaples.map(h=>`<div class="card"><h3>${h.name}</h3><p class="small">${h.container}</p><select onchange="state.homemade['${h.id}']=this.value;save();renderShopping()">${h.statuses.map(s=>`<option ${state.homemade[h.id]===s?'selected':''}>${s}</option>`).join('')}</select><details><summary>Restock ingredients</summary><p>${[...(h.ingredients||[]),...(h.frequent||[]),...(h.occasional||[]),...(h.supplies||[])].join(', ')}</p></details></div>`).join('');
 const f=DATA.pantry.minimumStock[0];
 document.getElementById('pantryList').innerHTML=`<div class="card"><h3>${f.item}</h3><p>Keep ${f.minimum} total: ${f.locations.home} at home and ${f.locations.work} at work.</p><p class="small">${f.shoppingNote}</p></div>${homemade}${stock}`;
}
function renderMeals(){const s=document.getElementById('sectionFilter').value,e=document.getElementById('effortFilter').value,w=document.getElementById('weatherFilter').value;const p=allItems().filter(i=>(!s||i.section===s)&&(!e||i.tags?.includes(e))&&(!w||i.tags?.includes(w)));document.getElementById('mealList').innerHTML=p.map(itemCard).join('')||'<div class="card">No matches.</div>';}
function matchIngredients(){const q=document.getElementById('useUp').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);const scored=allItems().map(i=>({i,score:q.filter(x=>JSON.stringify(i.ingredients||{}).toLowerCase().includes(x)).length})).filter(x=>x.score).sort((a,b)=>b.score-a.score);document.getElementById('homeResult').innerHTML=scored.length?scored.slice(0,8).map(x=>itemCard(x.i)).join(''):'<div class="card">No strong matches yet.</div>';}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
const sf=document.getElementById('sectionFilter');sf.innerHTML='<option value="">All sections</option>'+DATA.meals.sections.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
document.getElementById('effortFilter').innerHTML+=[...DATA.meals.tagGroups.effort].map(x=>`<option>${x}</option>`).join('');
document.getElementById('weatherFilter').innerHTML+=[...DATA.meals.tagGroups.weather].map(x=>`<option>${x}</option>`).join('');
renderMeals();renderWeek();renderPantry();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script>
