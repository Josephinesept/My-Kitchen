function allItems(){return DATA.meals.sections.flatMap(s=>s.items.map(i=>({...i,section:s.id,sectionName:s.name})))} function getMeal(id){return allItems().find(i=>i.id===id)}

function optionEditor(entry){const m=getMeal(entry.mealId),ing=m.ingredients||{},s=entry.selections||defaultSelections(m),parts=[];Object.entries(ing.chooseOne||{}).forEach(([k,vals])=>parts.push(`<div class="option-group"><strong>Choose one ${esc(k)}</strong>${vals.map(v=>`<label class="row"><input type="radio" name="${entry.entryId}-${esc(k)}" value="${esc(v)}" ${s.one[k]===v?'checked':''} data-one="${esc(k)}" data-entry="${entry.entryId}"><span>${esc(v)}</span></label>`).join('')}</div>`));Object.entries(ing.chooseSeveral||{}).forEach(([k,vals])=>parts.push(`<div class="option-group"><strong>Choose ${esc(k)}</strong>${vals.map(v=>`<label class="row"><input type="checkbox" ${s.many[k]?.includes(v)?'checked':''} data-many="${esc(k)}" data-value="${esc(v)}" data-entry="${entry.entryId}"><span>${esc(v)}</span></label>`).join('')}</div>`));if(ing.optional?.length)parts.push(`<div class="option-group"><strong>Optional additions</strong>${ing.optional.map(v=>`<label class="row"><input type="checkbox" ${s.optional[v]?'checked':''} data-optional="${esc(v)}" data-entry="${entry.entryId}"><span>${esc(v)}</span></label>`).join('')}</div>`);return parts.join('')}

function quantityFor(item){const k=canonical(item);if(qtyOverrides[k])return qtyOverrides[k];if(/sauce|oil|vinegar|salt|pepper|powder|paprika|cumin|coriander|turmeric|cayenne|chili|cinnamon|nutmeg|ginger|masala|gochugaru|bouillon|stock cube|msg|honey|ketchup|soy sauce|fish sauce|gochujang|yeast|flour|sugar|cornstarch|baking|vanilla/i.test(k))return [0,'pantry'];return [1,'package']}
function storeSection(item){const k=canonical(item);if(/cat food|cat treat|cat litter/.test(k))return 'Pet Supplies';if(/soap|detergent|toilet paper|paper towel|trash bag|cleaning|sponge/.test(k))return 'Household';if(/shampoo|conditioner|body wash|toothpaste|deodorant/.test(k))return 'Personal Care';if(/onion|garlic|ginger|carrot|spinach|mushroom|zucchini|cabbage|bean sprout|cucumber|potato|broccoli|cauliflower|pepper|lemon|lime|fruit|parsley|cilantro|green onion|jalape|radish|daikon/.test(k))return 'Produce';if(/tofu|tempeh|egg|cheese|yogurt|milk|butter/.test(k))return 'Refrigerated & Dairy';if(/bread|bagel|tortilla/.test(k))return 'Bakery';if(/frozen|dumpling|edamame|ice cream/.test(k))return 'Frozen';if(/can|beans|tomato|coconut milk|jar|pickle|kimchi/.test(k))return 'Canned & Jarred';if(/soy sauce|sesame oil|rice vinegar|fish sauce|gochujang|gochugaru|chili crunch|curry|miso|ramen/.test(k))return 'International Foods & Sauces';if(/salt|sugar|flour|cornstarch|baking|yeast|spice|oregano|basil|thyme|rosemary|sage|dill|paprika|cumin|coriander|turmeric|cayenne|chili|cinnamon|nutmeg|masala|bouillon|stock cube|mushroom umami|msg/.test(k))return 'Spices, Baking & Broth';if(/cracker|cookie|chocolate|fairlife|snack/.test(k))return 'Snacks & Drinks';return 'Dry Goods'}
function addShop(map,item,source,forceQty=null){const name=canonical(item);if(!name)return;const [base,unit]=forceQty||quantityFor(name);const key=name+'|'+unit;if(!map[key])map[key]={name,unit,exact:0,recipes:new Set(),reasons:new Set(),section:storeSection(name)};map[key].exact+=base;if(source?.recipe)map[key].recipes.add(source.recipe);if(source?.reason)map[key].reasons.add(source.reason)}
function pantryCollections(){return {...DATA.pantry.alwaysStocked,...DATA.pantry.spicesFlavorings,...DATA.pantry.householdPet,Remembered:state.rememberedItems.map(x=>x.name)}}
function pantryAvailable(item){return (state.pantryStatus[item]||'plenty')!=='out'}
function quickMealStatus(q){const missing=q.required.filter(x=>!pantryAvailable(x));return {...q,missing,ready:missing.length===0}}
function quickSummary(){const home=QUICK_MEALS.filter(q=>q.place==='home').map(quickMealStatus),work=QUICK_MEALS.filter(q=>q.place==='work').map(quickMealStatus);return {home,work,readyHome:home.filter(q=>q.ready).length,readyWork:work.filter(q=>q.ready).length}}
function quickRestoreItems(){const q=quickSummary(),deficit=Math.max(0,state.quickTarget-q.readyHome);if(!deficit)return [];const unavailable=q.home.filter(x=>!x.ready).sort((a,b)=>a.tier-b.tier||a.missing.length-b.missing.length),picked=[],restores=[];for(const meal of unavailable){if(restores.length>=deficit)break;restores.push(meal);for(const item of meal.missing)if(!picked.includes(item))picked.push(item)}return picked.map(item=>({item,meals:restores.filter(m=>m.missing.includes(item)).map(m=>m.name)}))}
function shoppingItemCount(){const map={};state.week.forEach(e=>{const m=getMeal(e.mealId);selectedIngredients(e).forEach(x=>addShop(map,x,{recipe:m.name}))});Object.entries(pantryCollections()).forEach(([g,items])=>items.forEach(x=>{const st=state.pantryStatus[x]||'plenty';if(st==='low'||st==='out')addShop(map,x,{reason:st})}));return Object.values(map).filter(x=>x.exact>0).length+state.manualItems.length}
function renderHome(){const q=quickSummary(),alerts=Object.values(pantryCollections()).flat().filter(x=>(state.pantryStatus[x]||'plenty')!=='plenty').length,homemade=DATA.pantry.homemadeStaples.filter(h=>state.homemade[h.id]!=='Plenty available').length;$('#homeOverview').innerHTML=`<div class="card"><div class="section-title"><h2>Kitchen overview</h2><button class="secondary" id="overviewInventoryBtn">Update inventory</button></div><div class="overview-grid"><div class="overview-item"><span class="small">Planned meals</span><b>${state.week.length}</b></div><div class="overview-item"><span class="small">Shopping items</span><b>${shoppingItemCount()}</b></div><div class="overview-item"><span class="small">Quick meals ready</span><b class="${q.readyHome>=state.quickTarget?'quick-ready':'quick-missing'}">${q.readyHome} / ${state.quickTarget}</b></div><div class="overview-item"><span class="small">Pantry alerts</span><b>${alerts+homemade}</b></div></div><details class="pantry-section" open><summary>Quick-meal coverage</summary><div class="field"><label for="quickTarget">Home target</label><select id="quickTarget">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${state.quickTarget===n?'selected':''}>${n} meals</option>`).join('')}</select></div>${q.home.map(x=>`<div class="row"><span style="flex:1"><strong class="quick-meal-name">${esc(x.name)}</strong><span class="shop-meta">${x.ready?'Ready':`Missing: ${x.missing.map(title).join(', ')}`}</span></span><span class="badge ${x.ready?'':'out'}">${x.ready?'Ready':'Unavailable'}</span></div>`).join('')}${q.work.length?`<h3>Work backup</h3>${q.work.map(x=>`<div class="row"><span style="flex:1"><strong class="quick-meal-name">${esc(x.name)}</strong><span class="shop-meta">${x.ready?'Ready':`Missing: ${x.missing.map(title).join(', ')}`}</span></span><span class="badge ${x.ready?'':'out'}">${x.ready?'Ready':'Unavailable'}</span></div>`).join('')}`:''}</details></div>`;$('#quickTarget').addEventListener('change',e=>{state.quickTarget=Number(e.target.value);save();renderHome()});$('#overviewInventoryBtn').addEventListener('click',()=>{state.inventoryMode=true;navTo('pantry')})}
function renderShopping(){const map={};state.week.forEach(e=>{const m=getMeal(e.mealId);selectedIngredients(e).forEach(x=>addShop(map,x,{recipe:m.name}))});if($('#includeQuick')?.checked)quickRestoreItems().forEach(x=>addShop(map,x.item,{reason:`Restores: ${x.meals.join(', ')}`}));Object.entries(pantryCollections()).forEach(([group,items])=>items.forEach(x=>{const status=state.pantryStatus[x]||'plenty';if(status==='low'||status==='out'){const q=quantityFor(x);addShop(map,x,{reason:status==='out'?'Out':'Consider restocking'},q[1]==='pantry'?[1,'container']:[Math.max(q[0],1),q[1]])}}));DATA.pantry.homemadeStaples.forEach(h=>{if(state.homemade[h.id]!=='Plenty available'){[...(h.ingredients||[]),...(h.frequent||[])].forEach(x=>addShop(map,x,{reason:`For ${h.name}`}));if(h.id!=='pickles')(h.supplies||[]).forEach(x=>addShop(map,x,{reason:`For ${h.name}`}));else (h.supplies||[]).forEach(x=>{const k=canonical(x),st=state.pantryStatus[k]||state.pantryStatus[x]||'plenty';if(st==='low'||st==='out')addShop(map,k,{reason:`For ${h.name}`},[1,'container'])})}});const groups={};Object.values(map).forEach(v=>{if(v.exact<=0)return;(groups[v.section]||=[]).push(v)});const order=['Produce','Refrigerated & Dairy','Protein & Meat Alternatives','Bakery','Canned & Jarred','Dry Goods','International Foods & Sauces','Spices, Baking & Broth','Frozen','Snacks & Drinks','Household','Personal Care','Pet Supplies'];const generated=order.filter(s=>groups[s]?.length).map((s,idx)=>`<details class="card shop-section" ${idx<4?'open':''}><summary>${s}</summary>${groups[s].sort((a,b)=>a.name.localeCompare(b.name)).map(v=>{const rounded=Math.ceil(v.exact);const recipeNames=[...v.recipes];const meta=[`${formatQty(v.exact)} needed${v.unit==='package'?'':` ${plural(v.unit,v.exact)}`}`,recipeNames.length?`${recipeNames.length} recipe${recipeNames.length===1?'':'s'}: ${recipeNames.join(', ')}`:'',[...v.reasons].join(' · ')].filter(Boolean).join(' · ');const key=(v.name+'|'+v.unit).replace(/"/g,'&quot;'),exportText=`${rounded>1?rounded+' ':''}${title(v.name)}`;return `<label class="row"><input type="checkbox" data-shop-key="${key}" data-export-text="${esc(exportText)}" ${state.checked[key]?'checked':''}><span style="flex:1"><span class="shop-item-main"><strong>${title(v.name)}</strong><strong>${rounded} ${plural(v.unit,rounded)}</strong></span><span class="shop-meta">${esc(meta)}</span></span></label>`}).join('')}</details>`).join('');const manual=state.manualItems.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>{const key='manual|'+x.id,exportText=`${x.quantity?x.quantity+' ':''}${title(x.name)}`;return `<div class="row"><input type="checkbox" data-manual-check="${x.id}" data-export-text="${esc(exportText)}" ${state.checked[key]?'checked':''}><span style="flex:1"><strong>${esc(title(x.name))}</strong>${x.quantity?`<div class="shop-meta">Quantity: ${esc(x.quantity)}</div>`:''}<div class="manual-actions"><button class="ghost" data-remember-manual="${x.id}">Remember</button><button class="danger" data-delete-manual="${x.id}">Delete</button></div></span></div>`}).join('');const manualSection=state.manualItems.length?`<div class="card"><div class="section-title"><h3>Manual additions</h3><button class="danger" id="clearManualBtn">Clear all</button></div>${manual}</div>`:'';$('#shoppingList').innerHTML=generated+manualSection||'<div class="card empty">Your shopping list is empty.</div>';$$('[data-shop-key]').forEach(x=>x.addEventListener('change',()=>{state.checked[x.dataset.shopKey]=x.checked;save()}));$$('[data-manual-check]').forEach(x=>x.addEventListener('change',()=>{state.checked['manual|'+x.dataset.manualCheck]=x.checked;save()}));$$('[data-delete-manual]').forEach(b=>b.addEventListener('click',()=>{state.manualItems=state.manualItems.filter(x=>x.id!==b.dataset.deleteManual);delete state.checked['manual|'+b.dataset.deleteManual];save();renderShopping();renderHome()}));$$('[data-remember-manual]').forEach(b=>b.addEventListener('click',()=>rememberManualItem(b.dataset.rememberManual)));$('#clearManualBtn')?.addEventListener('click',()=>{if(confirm('Remove all manual additions?')){state.manualItems.forEach(x=>delete state.checked['manual|'+x.id]);state.manualItems=[];save();renderShopping();renderHome()}})}
function plural(u,n){if(u==='pantry')return 'container'+(n===1?'':'s');if(n===1)return u;const irregular={loaf:'loaves',box:'boxes',bunch:'bunches'};return irregular[u]||u+'s'}function formatQty(n){return Number.isInteger(n)?String(n):(Math.round(n*4)/4).toString()}function title(s){return String(s).split(/(\s+|[-/])/).map(part=>/^[\p{L}]/u.test(part)?part.charAt(0).toUpperCase()+part.slice(1):part).join('')}
function statusButton(item){const st=state.pantryStatus[item]||'plenty';return `<button class="status ${st}" data-status-item="${esc(item)}">${st==='plenty'?'Plenty':st==='low'?'Low':'Out'}</button>`}
function renderPantry(){const groups=[['Pantry Staples',DATA.pantry.alwaysStocked],['Spices & Flavorings',DATA.pantry.spicesFlavorings],['Household & Pet',DATA.pantry.householdPet]];const open=state.inventoryMode?'open':'';const stock=groups.map(([titleName,obj])=>`<details class="card pantry-section" ${open}><summary>${titleName}</summary>${Object.entries(obj).map(([g,items])=>`<details class="pantry-subsection" ${open}><summary>${g}</summary>${items.map(x=>`<div class="row"><span style="flex:1">${esc(x)}</span>${statusButton(x)}</div>`).join('')}</details>`).join('')}</details>`).join('');const remembered=state.rememberedItems.length?`<details class="card pantry-section" ${open}><summary>Remembered items</summary><p class="small remembered-note">Recurring items saved from manual shopping additions.</p>${state.rememberedItems.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="row"><span style="flex:1">${esc(x.name)}</span>${statusButton(x.name)}<button class="danger" data-forget-item="${x.id}">Forget</button></div>`).join('')}</details>`:'';const homemade=DATA.pantry.homemadeStaples.map(h=>`<div class="card"><h3>${h.name}</h3><select data-homemade="${h.id}">${h.statuses.map(s=>`<option ${state.homemade[h.id]===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('');$('#inventoryBanner').innerHTML=state.inventoryMode?'<div class="inventory-banner">Inventory mode is on. All categories are expanded for a fast pantry walkthrough.</div>':'';$('#inventoryModeBtn').textContent=state.inventoryMode?'Finish inventory':'Inventory mode';$('#inventoryModeBtn').classList.toggle('inventory-on',state.inventoryMode);$('#pantryList').innerHTML=homemade+remembered+stock;$$('.pantry-section').forEach(section=>section.addEventListener('toggle',()=>{if(section.open&&!state.inventoryMode)section.querySelectorAll(':scope > .pantry-subsection').forEach(sub=>sub.open=true)}));$$('[data-status-item]').forEach(b=>b.addEventListener('click',()=>{const seq=['plenty','low','out'],cur=state.pantryStatus[b.dataset.statusItem]||'plenty',next=seq[(seq.indexOf(cur)+1)%3];state.pantryStatus[b.dataset.statusItem]=next;save();b.classList.remove('plenty','low','out');b.classList.add(next);b.textContent=next==='plenty'?'Plenty':next==='low'?'Low':'Out'}));$$('[data-homemade]').forEach(sel=>sel.addEventListener('change',()=>{state.homemade[sel.dataset.homemade]=sel.value;save()}));$$('[data-forget-item]').forEach(b=>b.addEventListener('click',()=>{const item=state.rememberedItems.find(x=>x.id===b.dataset.forgetItem);state.rememberedItems=state.rememberedItems.filter(x=>x.id!==b.dataset.forgetItem);if(item)delete state.pantryStatus[item.name];save();renderPantry();renderHome()}))}
function showRandom(section){const p=allItems().filter(i=>i.section===section),m=p[Math.floor(Math.random()*p.length)];$('#homeResult').innerHTML=mealCard(m);bindMealActions($('#homeResult'))}function showEmergency(){const q=quickSummary();$('#homeResult').innerHTML=`<div class="card"><h3>Quick meals</h3>${[...q.home,...q.work].map(x=>`<div class="row"><span style="flex:1"><strong class="quick-meal-name">${esc(x.name)}</strong><span class="shop-meta">${x.place==='work'?'Work backup · ':''}${x.ready?'Ready':`Missing: ${x.missing.map(title).join(', ')}`}</span></span><span class="badge ${x.ready?'':'out'}">${x.ready?'Ready':'Unavailable'}</span></div>`).join('')}</div>`}function generateGrazing(){const m=getMeal('grazing-template');if(!m)return;const t=m.generator,p=a=>a[Math.floor(Math.random()*a.length)];$('#homeResult').innerHTML=`<div class="card"><h3>Your grazing plate</h3><p><b>Protein:</b> ${p(t.protein)}<br><b>Crunch:</b> ${p(t.crunch)}<br><b>Acid:</b> ${p(t.acid)}<br><b>Produce:</b> ${p(t.produce)}<br><b>Extra:</b> ${p(t.extra)}</p></div>`}function matchIngredients(){const q=$('#useUp').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),p=allItems().map(m=>({m,n:q.filter(x=>JSON.stringify(m.ingredients||{}).toLowerCase().includes(x)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);$('#homeResult').innerHTML=p.length?p.slice(0,8).map(x=>mealCard(x.m)).join(''):'<div class="card empty">No strong matches yet.</div>';bindMealActions($('#homeResult'))}
function addManualItem(){const input=$('#manualItemName'),qty=$('#manualItemQty'),name=input.value.trim(),key=canonical(name);if(!name)return toast('Enter an item');if(state.manualItems.some(x=>canonical(x.name)===key))return toast('That item is already listed');if(state.rememberedItems.some(x=>canonical(x.name)===key))return toast('That item is already remembered');state.manualItems.push({id:uid(),name,quantity:qty.value.trim()});input.value='';qty.value='';save();renderShopping();renderHome();toast('Item added')}
function rememberManualItem(id){const item=state.manualItems.find(x=>x.id===id);if(!item)return;const existing=state.rememberedItems.find(x=>canonical(x.name)===canonical(item.name));if(!existing)state.rememberedItems.push({id:uid(),name:item.name});state.pantryStatus[item.name]='out';state.manualItems=state.manualItems.filter(x=>x.id!==id);delete state.checked['manual|'+id];save();renderShopping();renderPantry();renderHome();toast('Saved as a remembered item')}
function exportShoppingLines(){return $$('#shoppingList [data-export-text]').filter(x=>!x.checked).map(x=>x.dataset.exportText.trim()).filter(Boolean)}
function copyShopping(){const lines=exportShoppingLines();if(!lines.length)return toast('Nothing to export');navigator.clipboard?.writeText(lines.join('\n')).then(()=>toast('Shopping list copied')).catch(()=>toast('Copy is unavailable'))}
async function shareToReminders(){const lines=exportShoppingLines();if(!lines.length)return toast('Nothing to export');const text=lines.join('\n');if(navigator.share){try{await navigator.share({title:'Grocery List',text});return}catch(e){if(e?.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Copied—run your Grocery List shortcut')}catch(e){toast('Sharing is unavailable')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
$('#sectionFilter').innerHTML='<option value="">All sections</option>'+DATA.meals.sections.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');$('#effortFilter').innerHTML+=DATA.meals.tagGroups.effort.map(x=>`<option>${x}</option>`).join('');$('#weatherFilter').innerHTML+=DATA.meals.tagGroups.weather.map(x=>`<option>${x}</option>`).join('');$$('[data-random]').forEach(b=>b.addEventListener('click',()=>showRandom(b.dataset.random)));$('#emergencyBtn').addEventListener('click',showEmergency);$('#grazingBtn').addEventListener('click',generateGrazing);$('#homeWeekBtn').addEventListener('click',buildWeek);$('#suggestWeekBtn').addEventListener('click',buildWeek);$('#addMealsBtn').addEventListener('click',()=>navTo('meals'));$('#filterBtn').addEventListener('click',renderMeals);$('#matchBtn').addEventListener('click',matchIngredients);$('#copyBtn').addEventListener('click',copyShopping);$('#shareRemindersBtn').addEventListener('click',shareToReminders);$('#addManualItemBtn').addEventListener('click',addManualItem);$('#manualItemName').addEventListener('keydown',e=>{if(e.key==='Enter')addManualItem()});$('#manualItemQty').addEventListener('keydown',e=>{if(e.key==='Enter')addManualItem()});$('#includeQuick').addEventListener('change',renderShopping);$('#inventoryModeBtn').addEventListener('click',()=>{state.inventoryMode=!state.inventoryMode;renderPantry()});renderMeals();renderWeek();renderPantry();renderHome();save();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=5.0');
</script></body></html>
